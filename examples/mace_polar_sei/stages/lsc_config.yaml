# mace-scf run_train.py config for LSC-MACE. Keys are the extxyz names make_sets.py writes; clusters
# carry dipoles and polarizabilities (A^3), periodic frames energies, forces and stress.
heads:
  default:
    info_keys:
      energy: REF_energy
      stress: REF_stress
      dipole: REF_dipole
      polarizability: REF_polarizability
      total_charge: total_charge          # absent everywhere: every frame is neutral
    arrays_keys:
      forces: REF_forces
      charges: formal_charges
train_schedule:
  0:
    name: energy_forces
    start: 0
    end: 149
    loss:
      energy_per_atom: 1.0
      forces: 100.0
      stress: 10.0
    lr: 0.01
  1:
    name: with_response
    start: 150
    end: 299
    loss:
      energy_per_atom: 1000.0
      forces: 100.0
      stress: 10.0
      dipole_per_atom: 10.0
      polarizability: 1.0
    lr: 0.001
